# /home/unaa_leasing/docker-compose.yml
services:
  db:
    image: postgres:15
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    restart: always
    ports:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    image: unaa_leasing:${IMAGE_TAG:-latest}
    build: .
    command: gunicorn unaa_leasing.wsgi:application --bind 0.0.0.0:8000 --workers 3
    env_file:
      - .env
    depends_on:
      - db
    ports:
      - "8000:8000"          # хостовый nginx будет ходить сюда
    volumes:
      - ./static:/app/staticfiles
      - ./media:/app/media
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 5s
        order: start-first
        failure_action: rollback
      restart_policy:
        condition: any

  redis:
    image: "redis:alpine"
    volumes:
      - redis-data:/data
    restart: always

  celery:
    build: .
    image: unaa_leasing:${IMAGE_TAG:-latest}
    command: bash -c "celery -A unaa_leasing worker --loglevel=info"
    restart: always
    env_file:
      - .env
    depends_on:
      - app
      - redis

  celery-beat:
    build: .
    image: unaa_leasing:${IMAGE_TAG:-latest}
    command: celery -A unaa_leasing beat --loglevel=info
    restart: always
    env_file:
      - .env
    depends_on:
      - app
      - redis

volumes:
  pgdata:
  redis-data: